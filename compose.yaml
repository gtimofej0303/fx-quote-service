services:
  postgres:
    # Choose the container image.
    image: postgres:17-alpine
    # Set when this container restarts.
    restart: unless-stopped
    environment:
      # Set the database user.
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      # Set the database password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Set the database name.
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Allow connections only from this computer.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Save database files outside the container.
      - postgres_data:/var/lib/postgresql/data
    # Check database readiness.
    healthcheck:
      # Ask PostgreSQL if it accepts connections.
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      # Set the time between checks.
      interval: 3s
      # Limit the time for each check.
      timeout: 3s
      # Set how many failed checks are allowed.
      retries: 15

  migrate:
    # Choose the container image.
    image: fx-quote-service:local
    # The app builds this shared image before Compose creates either service.
    # Use the local image without downloading it.
    pull_policy: never
    # Run migrations instead of the API.
    entrypoint: ["/migrate"]
    environment:
      # Connect to PostgreSQL by its service name.
      PGHOST: postgres
      # Use the internal database port.
      PGPORT: "5432"
      # Read the required database user.
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      # Read the required database password.
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Read the required database name.
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # Disable SSL for this local connection.
      PGSSLMODE: disable
      # Set the amount of detail in logs.
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Wait for these services before starting.
    depends_on:
      postgres:
        # Require this service state before starting.
        condition: service_healthy
    # Set when this container restarts.
    restart: "no"

  app:
    # Choose the container image.
    image: fx-quote-service:local
    build: .
    environment:
      # Connect to PostgreSQL by its service name.
      PGHOST: postgres
      # Use the internal database port.
      PGPORT: "5432"
      # Read the required database user.
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      # Read the required database password.
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Read the required database name.
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # Disable SSL for this local connection.
      PGSSLMODE: disable
      # Listen for HTTP on port 8080.
      HTTP_ADDR: ":8080"
      # Set the amount of detail in logs.
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      # Allow connections only from this computer.
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    # Wait for these services before starting.
    depends_on:
      postgres:
        # Require this service state before starting.
        condition: service_healthy
      migrate:
        # Require this service state before starting.
        condition: service_completed_successfully
    # Set when this container restarts.
    restart: unless-stopped
    # Allow time to finish requests before stopping.
    stop_grace_period: 20s

volumes:
  postgres_data:
